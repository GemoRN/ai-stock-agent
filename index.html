<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Evaluator Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        .container { max-width: 900px; width: 100%; background: #1e293b; padding: 28px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid #334155; margin-top: 20px; min-height: 85vh; display: flex; flex-direction: column; }
        header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 28px; }
        h1 { color: #34d399; font-size: 28px; font-weight: 800; }
        .subtitle { color: #94a3b8; font-size: 12px; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .search-box { display: flex; gap: 10px; margin-bottom: 28px; max-width: 500px; margin-left: auto; margin-right: auto; width: 100%; }
        input { flex: 1; padding: 14px 18px; background: #0f172a; border: 1px solid #475569; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600; outline: none; transition: 0.2s; text-transform: uppercase; }
        input:focus { border-color: #34d399; box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2); }
        button { padding: 14px 28px; background: #34d399; border: none; border-radius: 12px; color: #0f172a; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button:hover { background: #059669; }
        #loader { text-align: center; padding: 40px 0; color: #94a3b8; font-size: 15px; display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #34d399; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #resultArea { display: none; flex-grow: 1; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; text-align: center; border: 2px solid #334155; margin-bottom: 28px; background-image: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        #stockName { font-size: 24px; font-weight: 800; color: #fff; }
        #stockPrice { font-size: 36px; font-weight: 900; color: #f1f5f9; margin: 10px 0; }
        #finalVerdict { margin-top: 12px; padding: 8px 24px; border-radius: 9999px; display: inline-block; font-size: 14px; font-weight: 800; border: 1px solid transparent; text-transform: uppercase; }
        .section-title { font-size: 13px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; border-left: 3px solid #34d399; padding-left: 8px; }
        
        /* RESPONSIVE MULTI-COLUMN INTERACTIVE PC GRID LAYOUT */
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 32px; }
        .row { background: #0f172a; padding: 16px; border-radius: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .m-left { display: flex; flex-direction: column; gap: 4px; }
        .m-name { font-weight: 700; font-size: 15px; color: #f1f5f9; }
        .m-desc { font-size: 12px; color: #64748b; }
        .m-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .m-val { font-weight: 800; font-size: 16px; color: #ffffff; }
        .badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 6px; text-transform: uppercase; }
        .bg-pass { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
        .bg-fail { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); }
        
        footer { margin-top: auto; padding-top: 20px; border-top: 1px solid #334155; text-align: center; }
        .footer-by { font-size: 13px; font-weight: 700; color: #34d399; letter-spacing: 0.5px; }
        .footer-desc { font-size: 11px; color: #64748b; margin-top: 6px; line-height: 1.5; font-style: italic; }
        
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; gap: 12px; }
            .container { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Stock Agent</h1>
            <div class="subtitle">10-Point Live Fundamental Checker</div>
        </header>

        <div class="search-box">
            <input type="text" id="tickerInput" placeholder="Enter Ticker (e.g. YESBANK, RELIANCE, TCS)" onkeypress="if(event.key==='Enter') analyzeStock()">
            <button onclick="analyzeStock()">Analyze</button>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <div>Running 10-point analysis algorithms...</div>
        </div>

        <div id="resultArea">
            <div class="card">
                <div id="stockName">---</div>
                <div id="stockPrice">₹0.00</div>
                <div id="finalVerdict">VERDICT</div>
            </div>

            <div class="section-title">Metric Breakdown Dashboard</div>
            <div id="checklistGrid" class="grid"></div>
        </div>

        <footer>
            <div class="footer-by">Created by Rameshwar Pangare</div>
            <div class="footer-desc">Just for educational purposes. Not for any financial advice. Always research before investing.</div>
        </footer>
    </div>

    <script>
        async function analyzeStock() {
            var ticker = document.getElementById('tickerInput').value.trim();
            if(!ticker) return alert("Please enter a stock name!");
            
            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultArea').style.display = 'none';
            
            try {
                var res = await fetch('/api/evaluate?ticker=' + encodeURIComponent(ticker));
                if(!res.ok) {
                    var errData = await res.json();
                    throw new Error(errData.detail || "Error loading stock.");
                }
                var data = await res.json();
                
                document.getElementById('stockName').innerText = data.name;
                document.getElementById('stockPrice').innerText = data.price;
                
                var verdictElement = document.getElementById('finalVerdict');
                verdictElement.innerText = data.verdict + " (" + data.score + ")";
                verdictElement.style.backgroundColor = data.color + "15";
                verdictElement.style.color = data.color;
                verdictElement.style.borderColor = data.color;
                
                var grid = document.getElementById('checklistGrid');
                grid.innerHTML = "";
                
                data.checklist.forEach(function(item) {
                    var isPass = item.status === "Pass";
                    var badgeStyle = isPass ? "badge bg-pass" : "badge bg-fail";
                    var icon = isPass ? "✓" : "✗";
                    
                    var rowHtml = '<div class="row">' +
                        '<div class="m-left">' +
                            '<div class="m-name">' + item.name + '</div>' +
                            '<div class="m-desc">' + item.desc + '</div>' +
                        '</div>' +
                        '<div class="m-right">' +
                            '<div class="m-val">' + item.val + '</div>' +
                            '<span class="' + badgeStyle + '">' + icon + ' ' + item.status + '</span>' +
                        '</div>' +
                    '</div>';
                    
                    grid.innerHTML += rowHtml;
                });
                
                document.getElementById('resultArea').style.display = 'block';
            } catch(err) {
                alert(err.message || "API Connection Error!");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
